version: 2

sources:
  - name: raw_bi_car
    database: DATABOOSTERS
    schema: PUBLIC
    tables:
      - name: CAR_SALES
        description: "Tabla de ventas de BBDD transaccional"
        columns:
          - name: DDATE
            description: "Fecha venta del coche"
          - name: SALESPERSON
            description: "Nombre del vendedor del coche"
            tests:
              - not_null
          - name: CUSTOMERNAME
            description: "Nombre del cliente que compró el coche"
          - name: CARMAKE
            description: "Marca del coche"
          - name: CARMODEL
            description: "Modelo del coche"
          - name: CARYEAR
            description: "Año modelo coche"
          - name: SALEPRICE
            description: "Precio del coche"
          - name: COMMISSIONRATE
            description: "% comisión del vendedor"
          - name: COMMISSIONEARNED
            description: "Valor de la comisión del vendedor"

     #tabla para snapshot
      - name: SALESPERSON
        description: 'tabla de vendedores'
        columns:
          - name: SALESPERSON_ID
            description: 'id único y clave primaria'
          - name: SALESPERSON_NAME
            description: 'nombre vendedor, no nulo'
          - name: COMMISSION_RATE
            description: tasa de comision, dos decimales (999,99)
          - name: store_id
            description: id de la tienda asociada
          - name: STATUS
            description: 'estado: activo/inactivo'
          - name: LAST_UPDATE_TS
            description: 'marca de tiempo última actualización (sin zona horaria)'
      - name: MARKETING_PIVOTED_PERFORMANCE
        description: 'Tabla de marketing'
        columns:
          - name: CAMPAIGN_ID
            description: 'Identificador de campaña'
          - name: REPORT_DATE
            description: 'Fecha del informe'
          - name: CHANNEL_NAME
            description: 'Nombre canal'
          - name: METRIC_NAME
            description: 'Nombre de la métrica'
          - name: METRIC_VALUE
            description: 'Valor métrica'
      - name: REGIONAL_SALES_APAC
        description: 'Ventas regionales APAC'
        columns:
          - name: ORDER_ID
          - name: ORDER_DATE
          - name: CUSTOMER_ID
          - name: PRODUCT_ID
          - name: QUANTITY
          - name: UNIT_PRICE
          - name: TOTAL_AMOUNT
          - name: COUNTRY_CODE_NA
          - name: IMPORT_DUTY_APAC
      - name: REGIONAL_SALES_EU
        description: 'Ventas regionales EU'
        columns:
          - name: ORDER_ID
          - name: ORDER_DATE
          - name: CUSTOMER_ID
          - name: PRODUCT_ID
          - name: QUANTITY
          - name: UNIT_PRICE
          - name: TOTAL_AMOUNT
          - name: COUNTRY_CODE_NA
          - name: SALES_TAX_RATE_NA
      - name: REGIONAL_SALES_NA
        description: 'Ventas regionales NA'
        columns:
          - name: ORDER_ID
          - name: ORDER_DATE
          - name: CUSTOMER_ID
          - name: PRODUCT_ID
          - name: QUANTITY
          - name: UNIT_PRICE
          - name: TOTAL_AMOUNT
          - name: COUNTRY_CODE_NA
          - name: SALES_TAX_RATE_NA
          
#BBDD para seguros y clima  
          
  - name: raw_cli_clima
    database: seguros_clima
    schema: innolab
    tables:
      - name: clientes
        description: "Tabla con datos de clientes por ciudad, año y mes"
        columns:
          - name: cliente_id
            description: "Identificador del cliente"
          - name: tipo_seguro
            description: "Tipo de seguro contratado"
          - name: zona
            description: "Zona geográfica del cliente"
          - name: edad
            description: "Edad del cliente"
          - name: valor_propiedad
            description: "Valor estimado de la propiedad"
          - name: valor_auto
            description: "Valor estimado del vehículo"
          - name: siniestro
            description: "Indicador de siniestro (1 = sí, 0 = no)"
          - name: valor_total
            description: "Valor total asegurado"
          - name: ciudad
            description: "Ciudad del cliente"
          - name: mes
            description: "Mes del registro"
          - name: anyo
            description: "Año del registro"
          - name: fecha
            description: "Fecha"
      - name: riesgos_climaticos
        description: "Tabla con riesgos climáticos por ciudad, año y mes"
        columns:
          - name: ciudad
            description: "Ciudad donde se produce el fenómeto climático"
          - name: mes
            description: "Mes del riesgo climático"
          - name: anyo
            description: "Año del riesgo climático"
          - name: temp_media
            description: "Temperatura media"
          - name: precipitacion_mm
            description: "Precipitación lluvia"
          - name: eventos_extremos
            description: "Nº enventos meteorológicos ocurridos"
          - name: riesgo_climatico
            description: "Valor del riesgo climático ocurrido"
          - name: riesgo_total
            description: "Porcentaje del riesgo climático"
          - name: fecha
            description: "Fecha del fenómeno ocurrido"
